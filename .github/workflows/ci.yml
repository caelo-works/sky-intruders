name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  pjsr:
    name: PJSR pure-logic tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test harness
        run: bash tests/run.sh

  package:
    name: Package builds + reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every PIDoc source has its compiled page
        run: |
          for src in docs/pidoc/*.pidoc; do
            page="$(basename "$src" .pidoc)"
            [ -f "doc/scripts/$page/$page.html" ] \
              || { echo "::error::doc/scripts/$page/$page.html missing (run scripts/build-script-doc.sh)"; exit 1; }
          done
      - name: Build the update package
        run: bash scripts/build-update-package.sh 0.0.0-ci
      - name: Package contract (unsigned development build)
        run: bash scripts/check-package.sh dist/*.zip
      - name: Zip is reproducible (same content -> same SHA-1)
        run: |
          name="$(ls dist/*.zip)"
          a="$(sha1sum "$name" | cut -d' ' -f1)"
          bash scripts/build-update-package.sh 0.0.0-ci
          b="$(sha1sum "$name" | cut -d' ' -f1)"
          echo "build #1: $a"; echo "build #2: $b"
          [ "$a" = "$b" ] || { echo "::error::the package zip is not reproducible"; exit 1; }
